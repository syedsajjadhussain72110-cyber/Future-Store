{% extends 'base.html' %}
{% block title %}Sign In - Future Store{% endblock %}
{% block content %}

<div class="max-w-md mx-auto py-8">
    <div class="text-center mb-6">
        <a href="{{ url_for('store.index') }}" class="logo" style="font-size:28px;display:inline-block;">
            Future Store
        </a>
    </div>

    <div class="bg-white rounded border border-gray-300 p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Sign In</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email address</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400"
                    placeholder="Enter your email" />
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400"
                    placeholder="Enter your password" />
            </div>

            <button type="submit" class="w-full btn-orange py-2 rounded font-semibold text-sm mb-3">
                Continue
            </button>
        </form>

        <p class="text-xs text-gray-500 mb-4">
            By continuing, you agree to Future Store's
            <a href="{{ url_for('pages.terms') }}" class="text-blue-600 hover:underline">Conditions of Use</a> and
            <a href="{{ url_for('pages.privacy') }}" class="text-blue-600 hover:underline">Privacy Notice</a>.
        </p>

        <div class="border-t pt-4">
            <p class="text-sm text-gray-600 mb-2">
                <strong class="text-gray-800">New to Future Store?</strong>
            </p>
            <a href="{{ url_for('auth.register') }}" class="block w-full text-center border border-gray-300 rounded py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
                Create your Future Store account
            </a>
        </div>
    </div>

</div>

{% endblock %}
